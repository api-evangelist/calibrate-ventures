name: Calibrate Ventures
description: >-
  Calibrate Ventures is a Pasadena, California venture capital firm backing
  visionary technical founders scaling deep tech to transform industries such as
  transportation and logistics, food and agriculture, healthcare, manufacturing,
  security, and warehousing. The firm invests in AI, computer vision, machine
  learning, robotics, and automation startups, partnering with founders to turn a
  technical breakthrough into scalable commercial advantage and drawing on decades
  of combined investment and company-building experience. This profile was surfaced
  as a portfolio-adjacent company in the API Evangelist network and enriched from
  the firm's public web presence.
